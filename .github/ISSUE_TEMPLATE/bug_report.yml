name: Bug report
description: Report a reproducible problem in BreachHound
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Merci de ne jamais publier de logs réels contenant des secrets, tokens, mots de passe ou données personnelles.
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: "1.0.0"
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python
      placeholder: "3.12"
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Donnez les commandes et étapes minimales permettant de reproduire le problème.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Résultat attendu
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Résultat obtenu
    validations:
      required: true
